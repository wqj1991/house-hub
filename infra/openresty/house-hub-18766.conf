# 线上 1Panel 站点 house-hub（服务器 conf/conf.d/house-hub.conf）的可复现快照
# 作用：https://47.95.238.28:18766  —— 根路径出页面（前端），/house-api/ 出接口（后端）
# 注意：这个文件由 1Panel 生成，末尾「house-hub 路由」那段是手工加/改的，面板里「保存站点」会被覆盖，需要重新贴回。
# 改完必须：docker exec 1Panel-openresty-OLgm openresty -t && docker exec 1Panel-openresty-OLgm openresty -s reload
#       （openresty 跑在容器里，宿主机上没有 /usr/local/openresty/bin/openresty）
# 证书：Let's Encrypt IP 证书（SAN=IP 47.95.238.28），有效期只有 6 天，到期前必须续，否则 TLS 直接失败。
# 注：原 1Panel 生成的 include /www/sites/house-hub/proxy/*.conf（location ^~ / 全量反代 8766）已移除，
#     否则它会把根路径也吃成接口。接口现在只走 /house-api/ 前缀。

server {
    listen 18766 ssl http2 ;
    listen 443 ssl http2 ;
    server_name 47.95.238.28;
    index index.php index.html index.htm default.php default.htm default.html;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    access_log /www/sites/house-hub/log/access.log main;
    error_log /www/sites/house-hub/log/error.log;
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }
    # ===== house-hub 路由（手工维护；1Panel 里保存站点会覆盖本节）=====
    # /                  -> 前端页面（Vite 产物，base=/house/，静态根 /www/house）
    location ^~ /house/ {
        root /www;
        index index.html;
        try_files $uri $uri/ /house/index.html;
    }
    location = /house { return 301 /; }
    location ^~ /house-api/ {
        proxy_pass http://127.0.0.1:8766/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location ^~ / {
        root /www/house;
        index index.html;
        try_files $uri $uri/ /house/index.html;
    }
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }
    ssl_certificate /www/sites/house-hub/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/house-hub/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2 TLSv1.1 TLSv1;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host:18766$request_uri;
    proxy_set_header X-Forwarded-Proto https;
    add_header Strict-Transport-Security "max-age=31536000";
}
