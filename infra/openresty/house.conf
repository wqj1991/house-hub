# /usr/local/openresty/nginx/conf/conf.d/house.conf
# 静态站点 + /house-api/ 反代；/internal 故意不转出去（只有 127.0.0.1 能调）。

server {
    listen 80;
    server_name house.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name house.example.com;

    ssl_certificate     /etc/letsencrypt/live/house.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/house.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:house_ssl:10m;

    root /var/www/house;
    index index.html;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 带 hash 的构建产物可以长缓存；index.html 必须每次问
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /house-api/ {
        proxy_pass http://127.0.0.1:8787/;   # 结尾斜杠：把 /house-api 前缀剥掉
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA 兜底：任何前端路由都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
