# /usr/local/openresty/nginx/conf/conf.d/house.conf
# 静态站点 + /house-api/ 反代；/internal 故意不转出去（只有 127.0.0.1 能调）。

# 限流（http 上下文，conf.d 就挂在 http 里）：普通接口按 IP 放行 20r/s，登录按 6r/m 卡。
limit_req_zone $binary_remote_addr zone=house_api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=house_auth:10m rate=6r/m;
limit_req_status 429;

server {
    listen 80;
    server_name house.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name house.example.com;

    ssl_certificate     /etc/letsencrypt/live/house.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/house.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:house_ssl:10m;

    root /var/www/house;
    index index.html;
    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 带 hash 的构建产物可以长缓存；index.html 必须每次问
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # 登录/配对单独限流：撞库和爆破先卡在这里，别进 Node
    location /house-api/auth/ {
        limit_req zone=house_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /house-api/ {
        limit_req zone=house_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8787/;   # 结尾斜杠：把 /house-api 前缀剥掉
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    # SPA 兜底：任何前端路由都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
