[package]
name = "house-hub"
version = "0.2.0"
description = "买房 — 三端一后端的桌面 / 移动壳"
edition = "2021"
rust-version = "1.90"

[lib]
name = "house_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled：自带 SQLite 源码，Android/iOS 不赌系统 libsqlite3
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
strip = true
